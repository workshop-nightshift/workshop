<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Letterpress</title>
<style>
:root{--bg:#f6f3ec;--fg:#1d1b18;--mute:#6f6a60;--line:#d9d3c6;--ink:29,27,24;--hot:180,71,43}
@media (prefers-color-scheme:dark){:root{--bg:#121315;--fg:#e9e6df;--mute:#9a958b;--line:#2b2c30;--ink:233,230,223;--hot:229,138,99}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}
body{font:15px/1.5 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;min-height:100vh}
main{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px;max-width:760px;width:100%;margin:0 auto}
h1{font-size:15px;margin:0;font-weight:600}
p{margin:0;color:var(--mute)}
canvas{width:100%;height:180px;display:block;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
textarea{width:100%;min-height:140px;resize:vertical;font:inherit;font-size:17px;line-height:1.6;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:4px;padding:12px}
textarea:focus{outline:2px solid rgba(var(--hot),.5);outline-offset:-1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--mute)}
#tempo{accent-color:rgb(var(--hot))}
footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:12px 16px 16px;color:var(--mute)}
a{color:inherit}
.legend{font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Letterpress</h1>
  <p>An instrument with one key per letter. Type, and each letter sounds. Vowels ring, consonants pluck, spaces rest, full stops land home.</p>
  <canvas id="roll" aria-hidden="true"></canvas>
  <textarea id="t" spellcheck="false" aria-label="Type here to play">the quiet hours are borrowed, so play them softly.</textarea>
  <div class="row">
    <button id="play">▶ play the page</button>
    <button id="clear">clear</button>
    <label class="legend">tempo <input id="tempo" type="range" min="3" max="16" value="8"></label>
  </div>
  <p class="legend">Capitals are louder. Commas breathe. Questions rise. Digits knock.</p>
</main>
<footer>
  <span>002 · toy</span>
  <span><a href="../../">← shelf</a></span>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const ta = $("t"), cv = $("roll"), g = cv.getContext("2d");
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// ---- sound -------------------------------------------------------------
let ac, out;
function audio(){
  if (ac) return ac;
  // iOS: ask for "playback" so the ring/silent switch doesn't mute us (iOS 16.4+)
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {}
  ac = new (window.AudioContext || window.webkitAudioContext)();
  out = ac.createGain(); out.gain.value = 0.5;
  // a little room: two short feedback delays
  const d1 = ac.createDelay(), d2 = ac.createDelay(), fb = ac.createGain(), wet = ac.createGain();
  d1.delayTime.value = 0.137; d2.delayTime.value = 0.211; fb.gain.value = 0.32; wet.gain.value = 0.25;
  out.connect(ac.destination);
  out.connect(d1); d1.connect(d2); d2.connect(fb); fb.connect(d1); d2.connect(wet); wet.connect(ac.destination);
  return ac;
}

// Phones only allow sound after a real tap, and some keyboards' keystrokes don't
// count. So unlock on every kind of gesture until the context is actually running.
let silentEl;
function silentWav(){
  const n = 800, b = new ArrayBuffer(44 + n), v = new DataView(b), s = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  s(0, "RIFF"); v.setUint32(4, 36 + n, true); s(8, "WAVEfmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); s(36, "data"); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
  return URL.createObjectURL(new Blob([b], { type: "audio/wav" }));
}
function unlock(){
  const a = audio();
  if (a.state !== "running") a.resume().catch(() => {});
  // a silent buffer through Web Audio, and a silent <audio> element, which on older
  // iOS moves the page into the media category that ignores the silent switch
  const src = a.createBufferSource(); src.buffer = a.createBuffer(1, 1, 22050); src.connect(a.destination); src.start(0);
  if (!silentEl){ silentEl = new Audio(silentWav()); silentEl.setAttribute("playsinline", ""); }
  silentEl.play().catch(() => {});
}
const GESTURES = ["pointerdown", "touchend", "keydown", "click"];
function onGesture(){
  unlock();
  if (ac && ac.state === "running") GESTURES.forEach((ev) => document.removeEventListener(ev, onGesture, true));
}
GESTURES.forEach((ev) => document.addEventListener(ev, onGesture, true));

// D major pentatonic-ish (D E F# A B), three octaves
const SCALE = [0, 2, 4, 7, 9];
const ROOT = 146.83; // D3
const hz = (deg) => ROOT * 2 ** ((SCALE[((deg % 5) + 5) % 5] + 12 * Math.floor(deg / 5)) / 12);

// letters ordered roughly by English frequency; common letters sit mid-register
const ORDER = "etaoinshrdlcumwfgypbvkjxqz";
const MIDDLE = [5,6,4,7,3,8,2,9,6,5,4,7,3,8,1,10,2,9,0,11,1,12,0,13,12,14];
const VOWELS = new Set("aeiouy");

function tone(freq, { at = 0, dur = 0.4, vol = 0.2, kind = "pluck" } = {}){
  const a = audio(), t = a.currentTime + at;
  const env = a.createGain(); env.connect(out);
  env.gain.setValueAtTime(0.0001, t);
  if (kind === "bell"){
    env.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    env.gain.exponentialRampToValueAtTime(0.0001, t + dur * 3);
    for (const [mul, v] of [[1, 1], [2.01, 0.35], [3.98, 0.12]]){
      const o = a.createOscillator(), gg = a.createGain();
      o.type = "sine"; o.frequency.value = freq * mul; gg.gain.value = v;
      o.connect(gg); gg.connect(env); o.start(t); o.stop(t + dur * 3 + 0.05);
    }
  } else if (kind === "knock"){
    const n = a.createBufferSource(), buf = a.createBuffer(1, a.sampleRate * 0.08, a.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length) ** 3;
    const f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 6;
    n.buffer = buf; n.connect(f); f.connect(env);
    env.gain.exponentialRampToValueAtTime(vol * 2.5, t + 0.002);
    env.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    n.start(t);
  } else {
    const o = a.createOscillator(), f = a.createBiquadFilter();
    o.type = "triangle"; o.frequency.value = freq;
    f.type = "lowpass"; f.frequency.setValueAtTime(freq * 8, t); f.frequency.exponentialRampToValueAtTime(freq * 1.5, t + dur);
    o.connect(f); f.connect(env);
    env.gain.exponentialRampToValueAtTime(vol, t + 0.004);
    env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.05);
  }
}

// returns {beats} consumed by the character, and sounds it
function strike(ch, beat){
  const lower = ch.toLowerCase(), i = ORDER.indexOf(lower);
  const loud = ch !== lower ? 1.8 : 1;
  if (i >= 0){
    const deg = MIDDLE[i];
    if (VOWELS.has(lower)){
      tone(hz(deg), { dur: beat * 2.2, vol: 0.09 * loud, kind: "bell" });
      mark(deg, ch, true);
    } else {
      tone(hz(deg), { dur: beat * 1.6, vol: 0.13 * loud, kind: "pluck" });
      mark(deg, ch, false);
    }
    return 1;
  }
  if (/[0-9]/.test(ch)){ tone(400 + (+ch) * 180, { vol: 0.15, kind: "knock" }); mark(-1, ch, false); return 1; }
  if (ch === "."  || ch === "!"){
    tone(hz(0), { dur: beat * 3, vol: 0.12, kind: "bell" });
    tone(hz(5), { at: 0.01, dur: beat * 3, vol: 0.07, kind: "bell" });
    mark(0, ch, true); return 3;
  }
  if (ch === "?"){
    tone(hz(3), { dur: beat, vol: 0.1, kind: "bell" });
    tone(hz(9), { at: beat * 0.8, dur: beat * 2, vol: 0.1, kind: "bell" });
    mark(9, ch, true); return 3;
  }
  if (ch === "," || ch === ";" || ch === ":") return 2;
  if (ch === "\n") return 4;
  return 1; // space, anything else: a rest
}

// ---- picture -----------------------------------------------------------
let marks = [];
function mark(deg, ch, ring){ marks.push({ deg, ch, ring, born: performance.now() }); if (marks.length > 400) marks.shift(); }

function size(){
  const dpr = devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", size); size();

function frame(now){
  const W = cv.clientWidth, H = cv.clientHeight, ink = css("--ink"), hot = css("--hot");
  g.clearRect(0, 0, W, H);
  const speed = 0.06; // px per ms, drifting left
  g.font = "12px ui-monospace,Menlo,monospace"; g.textAlign = "center"; g.textBaseline = "middle";
  // faint staff: one line per octave root
  g.strokeStyle = `rgba(${ink},.08)`; g.lineWidth = 1;
  for (let o = 0; o <= 3; o++){ const y = H - 16 - (o * 5) / 15 * (H - 32); g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  marks = marks.filter((m) => W - 24 - (now - m.born) * speed > -20);
  for (const m of marks){
    const age = now - m.born, x = W - 24 - age * speed;
    const y = m.deg < 0 ? H - 8 : H - 16 - (m.deg / 15) * (H - 32);
    const fresh = Math.max(0, 1 - age / 600);
    if (m.ring){
      const r = 4 + Math.min(age / 40, 14);
      g.strokeStyle = `rgba(${hot},${0.15 + 0.6 * Math.max(0, 1 - age / 2500)})`;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke();
    }
    g.fillStyle = fresh > 0 ? `rgba(${hot},${0.4 + 0.6 * fresh})` : `rgba(${ink},.55)`;
    if (m.deg < 0){ g.fillRect(x - 1, y - 6, 2, 8); }
    else { g.fillText(m.ch, x, y); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- input -------------------------------------------------------------
const beatSec = () => 1 / +$("tempo").value;

ta.addEventListener("input", (e) => {
  stop();
  if (ac && ac.state !== "running") ac.resume().catch(() => {});
  if (e.inputType === "insertText" && e.data) for (const ch of e.data.slice(0, 4)) strike(ch, beatSec());
  else if (e.inputType === "insertLineBreak") strike("\n", beatSec());
});

let timer = null;
function stop(){ clearTimeout(timer); timer = null; $("play").textContent = "▶ play the page"; }
function play(){
  if (timer){ stop(); return; }
  unlock();
  const text = ta.value; let i = 0;
  $("play").textContent = "■ stop";
  const step = () => {
    if (i >= text.length){ stop(); return; }
    ta.setSelectionRange(i, i + 1);
    const beats = strike(text[i++], beatSec());
    timer = setTimeout(step, beats * beatSec() * 1000);
  };
  step();
}
$("play").onclick = play;
$("clear").onclick = () => { stop(); ta.value = ""; ta.focus(); };
</script>
</body>
</html>
