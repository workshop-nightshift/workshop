<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Readings</title>
<style>
:root{
  --wall:#c9c2b4;--card:#f3ecd8;--card2:#ebe2c8;--ink:#23201b;--print:#7a2e22;--mute:#7a7060;--rule:#cdbf9f;
  --T:#5e5b56;--M:#22408f;--S:#1d7347;--J:#8a3b1c;--K:#6a3a85;--bar:#8b7f68;--hi:#c0392b;--shadow:rgba(50,35,10,.25)
}
@media (prefers-color-scheme:dark){:root{
  --wall:#11100e;--card:#25221c;--card2:#2c2821;--ink:#e6dcc8;--print:#e58a72;--mute:#9a8f7b;--rule:#433b2f;
  --T:#b0aca4;--M:#94adf0;--S:#6fd39d;--J:#eaa07a;--K:#c8a1e3;--bar:#8f846e;--hi:#ff7a66;--shadow:rgba(0,0,0,.55)
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--wall);color:var(--ink)}
body{font:16px/1.45 Georgia,"Iowan Old Style","Times New Roman",serif;padding:16px 16px 90px;min-height:100vh}
button{font:inherit;color:inherit}
.wrap{max-width:620px;margin:0 auto}
.found{color:var(--mute);font-style:italic;font-size:.92rem;margin:0 0 12px}
.chart{background:var(--card);border-radius:3px;box-shadow:0 2px 8px var(--shadow);padding:8px 10px 4px;margin:0 0 12px}
.chart svg{display:block;width:100%;height:96px;touch-action:manipulation;cursor:pointer}
.chart .cap{display:flex;justify-content:space-between;font-size:.75rem;color:var(--mute);gap:8px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 -1px;position:relative;z-index:1}
.tab{border:1px solid var(--rule);border-bottom:none;background:var(--card2);padding:4px 14px;border-radius:6px 6px 0 0;cursor:pointer;font-size:.88rem}
.tab[aria-selected=true]{background:var(--card);font-weight:bold}
.only{margin-left:auto;font-size:.82rem;color:var(--ink);display:flex;gap:6px;align-items:center;cursor:pointer;padding:4px 0}
.only input{accent-color:var(--print)}
.card{background:var(--card);border:1px solid var(--rule);box-shadow:0 3px 12px var(--shadow);padding:14px 12px 18px;border-radius:0 3px 3px 3px;
  background-image:radial-gradient(circle at 50% 10px,var(--wall) 0 4px,transparent 5px)}
.head{text-align:center;color:var(--print);margin:12px 0 10px;font-family:"Gill Sans","Helvetica Neue",Arial,sans-serif;letter-spacing:.06em}
.head b{display:block;font-size:.95rem;letter-spacing:.14em}
.head small{display:block;font-size:.7rem;letter-spacing:.04em;color:var(--print);opacity:.85;margin-top:2px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:600 .66rem/1.2 "Gill Sans","Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--print);
  border-bottom:1.5px solid var(--print);padding:4px 4px;text-align:left}
th.n,td.n{text-align:right}
td{border-bottom:1px solid var(--rule);padding:3px 4px;vertical-align:top;font-family:"Courier New",Courier,monospace;font-size:.92rem}
tr.q{cursor:pointer}
tr.q.on td{background:color-mix(in srgb,var(--hi) 14%,transparent)}
td.by{padding-left:10px;font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;font-size:.85rem;color:var(--J);white-space:nowrap}
td.by.K{color:var(--K)}
td.est{color:var(--mute)}
tr.note td{border-bottom:1px solid var(--rule);padding:0 4px 6px 18px;font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;font-size:.98rem;line-height:1.3}
tr.note td p{margin:3px 0 0}
.h-T{color:var(--T)}.h-M{color:var(--M)}.h-S{color:var(--S)}.h-J{color:var(--J)}.h-K{color:var(--K)}
.h-T{font-family:"Bradley Hand","Segoe Print",cursive;letter-spacing:.01em;opacity:.95}
tr.note.on td{background:color-mix(in srgb,var(--hi) 10%,transparent)}
.hide-plain tr.q.plain{display:none}
.foot{margin:16px 4px 0;color:var(--mute);font-size:.85rem;font-style:italic}
.key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--mute);margin:10px 2px 0}
.key span b{font-weight:normal;font-family:"Bradley Hand","Segoe Print",cursive;font-size:.95rem}
@media (max-width:420px){
  td{font-size:.84rem;padding:3px 2px}
  th{padding:4px 2px;font-size:.6rem}
  tr.note td{padding-left:10px}
}
</style>
</head>
<body>
<div class="wrap">
  <p class="found">Pinned inside the cupboard under the stairs, beside the meter. Tap a bar, or a line.</p>
  <div class="chart">
    <svg id="ch" role="img" aria-label="Units used each quarter, 1961 to 1990"></svg>
    <div class="cap"><span id="capL">units each quarter</span><span id="capR"></span></div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-side="0" aria-selected="true">Front</button>
    <button class="tab" role="tab" data-side="1" aria-selected="false">Back</button>
    <label class="only"><input type="checkbox" id="only"> only the lines with notes</label>
  </div>
  <div class="card" id="card">
    <div class="head"><b>ELECTRICITY</b>METER READING RECORD<small>Keep this card by your meter. The reader will enter each reading.</small></div>
    <table>
      <thead><tr><th>Date</th><th class="n">Reading</th><th class="n">Units</th><th>Read by</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="key" id="key"></div>
  <p class="foot" id="foot"></p>
</div>
<script>
(function(){
// ---- STORY ----
// hands: T Ted (pencil), M May, S Sue, J Jim P. (reader 1966-87), K the reader after him
const HANDS={T:'Ted',M:'May',S:'Sue',J:'Jim, the reader',K:'the reader after Jim'};
// key: 'YYYY-M' (M = 3,6,9,12). m = multiplier on the modelled units. est = no access, reading estimated.
const EV={
 '1961-6':{m:.42,n:[['M','Moved in Fri 2nd June. Ted put the card up so we’d know where we stood.']]},
 '1961-9':{n:[['T','Lathe in the shed is on this meter. Mind it.']]},
 '1962-3':{n:[['M','First winter. Ted says we’re not made of money.']]},
 '1963-3':{m:1.42,n:[['T','Snow since Boxing Day. Fire on all day, pipes went twice, the man says coldest since 1740.'],['M','Ted’s mother stopped with us Jan & Feb.']]},
 '1964-6':{m:1.2,n:[['M','Susan Margaret, 9th April, 7lb 2oz. Kettle never off.']]},
 '1964-12':{m:1.05,n:[['M','Twin tub. On the never-never.']]},
 '1966-3':{n:[['M','New man. Wiped his feet.']]},
 '1966-9':{m:1.08,n:[['T','Rented a set for the World Cup. Kept it.']]},
 '1967-12':{n:[['J','Dog OK with me now. J.P.']]},
 '1969-12':{est:.55,n:[['M','Estimated. We were at Mum’s, she was bad.']]},
 '1970-3':{n:[['T','There it is. Catch-up. Paid in two goes.']]},
 '1971-3':{n:[['M','Bill in new money. Ted worked it all back into old to be sure.']]},
 '1972-3':{m:.84,n:[['M','Cuts by rota, our letter was G. Candles in the kitchen. Sue thought it was a party.']]},
 '1973-6':{n:[['J','Mind the step, it’s loose. J.P.'],['T','Fixed.']]},
 '1974-3':{m:.78,n:[['T','Three-day week. Home Wed to Fri. Nothing to turn, lathe off.']]},
 '1975-12':{m:1.06,n:[['M','Fan heater for Sue’s room, she does her homework up there now.']]},
 '1976-3':{n:[['M','Turned the card over.']]},
 '1976-9':{m:.7,n:[['M','Hot summer. No fire since April. Washing dry in an hour.']]},
 '1977-6':{n:[['M','Tea, J.? — M.'],['J','Two sugars. J.P.']]},
 '1978-12':{m:1.25,n:[['M','Ted home from the works. Front room fire on all day for him.']]},
 '1979-3':{m:1.16,n:[['M','Bitter. Doctor twice a week.'],['J','Sorry to hear about Mr H. J.P.']]},
 '1979-6':{n:[['M','Ted died 2nd May.']]},
 '1979-9':{n:[['M','Lathe sold. Shed light off.']]},
 '1980-12':{n:[['M','Sue does the bills now, she’s quicker.']]},
 '1981-6':{n:[['J','Cake tin back with thanks. J.P.']]},
 '1982-9':{m:.88,n:[['M','Sue to Leeds. Quiet.']]},
 '1982-12':{wrap:1,n:[['J','Clock’s gone round. 99999 then 00000, nothing wrong with it. J.P.']]},
 '1983-12':{n:[['M','Sue home three weeks.']]},
 '1985-12':{m:1.12,n:[['S','Home for Christmas, put the immersion on, Mum told me off. S.']]},
 '1986-9':{n:[['J','Twenty years on this meter Mrs H. J.P.'],['M','Twenty years of two sugars.']]},
 '1987-3':{n:[['J','Retiring end of the month. Look after yourself May. Jim'],['M','Jim’s last. Gave him the cake tin to keep.']]},
 '1987-6':{n:[['M','New girl. Very nice. Doesn’t take tea.']]},
 '1988-12':{m:1.18,n:[['M','Heater on more. Feet.']]},
 '1989-3':{m:1.15,n:[['S','Rang Mum Sundays and Wednesdays. Heater on all hours. S.']]},
 '1989-12':{est:.5,n:[['S','Estimated. Mum in hospital since November. S.']]},
 '1990-3':{m:.32,n:[['S','Mum came home to mine instead. House empty. Heating on low for the pipes. S.']]},
 '1990-6':{m:.15,last:1,n:[['S','Final reading. Supply off. I’m taking the card. S.']]}
};
// ---- END STORY ----

// ---- MODEL ----
function rnd(seed){let s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const R=rnd(84);
const SEASON={3:1.45,6:.8,9:.68,12:1.12};
function base(y){ // y as year + fraction
  if(y<1964.3)return 640+30*(y-1961);
  if(y<1979.4)return 770+21*(y-1964);
  if(y<1982.7)return 600;
  return 540+6*(y-1982.7);
}
function reader(k,y){
  if(k==='1990-6')return 'K.A.';
  if(y<1966.1)return 'R.D.';
  if(y<1987.4)return 'J.P.';
  return 'K.A.';
}
const Q=[];
for(let y=1961;y<=1990;y++)for(const m of [3,6,9,12]){
  if(y===1961&&m<6)continue; if(y===1990&&m>6)continue;
  const k=y+'-'+m, yy=y+m/12, e=EV[k]||{};
  const u=Math.round(base(yy)*SEASON[m]*(e.m||1)*(0.94+R()*0.12));
  Q.push({k,y,m,day:2+Math.floor(R()*22),units:u,e,reader:reader(k,yy)});
}
Q[0].day=2;Q[0].units=0;Q[0].opening=true; // the reading on the day they moved in
// true cumulative; choose a start so the meter rolls over in the 'wrap' quarter
let cum=0;const wi=Q.findIndex(q=>q.e.wrap);
for(let i=0;i<Q.length;i++){Q[i].cumBefore=cum;cum+=Q[i].units}
const start=((100000-Q[wi].cumBefore-Math.round(Q[wi].units*.4))%100000+100000)%100000;
// shown readings: estimates under-read, the next actual reading catches up
let shown=start, carry=0;
for(let i=0;i<Q.length;i++){
  const q=Q[i], trueR=(start+q.cumBefore+q.units)%100000;
  if(q.e.est){q.est=true;q.shownUnits=Math.round(q.units*q.e.est);}
  else q.shownUnits=q.units+carry;
  carry=q.est?q.units-q.shownUnits:0;
  q.reading=q.est?(shown+q.shownUnits)%100000:trueR;
  shown=q.reading;
}
const SIDE_SPLIT=Q.findIndex(q=>q.k==='1976-3');
// ---- END MODEL ----

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(5,'0');
const yy=y=>String(y).slice(2);
let side=0, sel=-1;

function render(){
  const tb=$('#rows');let h='';
  const a=side?SIDE_SPLIT:0, b=side?Q.length:SIDE_SPLIT;
  for(let i=a;i<b;i++){
    const q=Q[i],notes=q.e.n||[];
    const by=q.est?'<td class="by est">E</td>':`<td class="by${q.reader==='K.A.'?' K':''}">${q.reader}</td>`;
    h+=`<tr class="q${notes.length?'':' plain'}${i===sel?' on':''}" data-i="${i}"><td>${q.day}.${q.m}.${yy(q.y)}</td><td class="n${q.est?' est':''}">${pad(q.reading)}</td><td class="n${q.est?' est':''}">${q.opening?'—':q.shownUnits+(q.est?'*':'')}</td>${by}</tr>`;
    if(notes.length){
      h+=`<tr class="note${i===sel?' on':''}" data-i="${i}"><td colspan="4">`+notes.map(([w,t])=>`<p class="h-${w}">${t}</p>`).join('')+`</td></tr>`;
    }
  }
  tb.innerHTML=h;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(+t.dataset.side===side)));
  $('#foot').textContent=side?'* estimated: no access. The next reading puts it right.':'Continued overleaf.';
  chart();
}

function chart(){
  const svg=$('#ch'),W=Math.max(280,Math.round(svg.getBoundingClientRect().width)||600),H=96,top=6,bot=14,n=Q.length,bw=W/n;
  const max=Math.max(...Q.map(q=>q.shownUnits));
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  let s='';
  for(let x=1965;x<=1990;x+=5){
    const i=Q.findIndex(q=>q.y===x);if(i<0)continue;
    s+=`<line x1="${(i*bw).toFixed(1)}" x2="${(i*bw).toFixed(1)}" y1="${top}" y2="${H-bot}" stroke="var(--rule)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    if(i*bw+30<W)s+=`<text x="${(i*bw+2).toFixed(1)}" y="${H-3}" font-size="10" fill="var(--mute)" font-family="Georgia,serif">${x}</text>`;
  }
  const a=side?SIDE_SPLIT:0, b=side?Q.length:SIDE_SPLIT;
  Q.forEach((q,i)=>{
    const hh=(H-top-bot)*q.shownUnits/max, x=i*bw+bw*.12, w=bw*.76;
    const inSide=i>=a&&i<b, note=!!(q.e.n);
    const fill=i===sel?'var(--hi)':(q.est?'none':'var(--bar)');
    s+=`<rect x="${x.toFixed(2)}" y="${(H-bot-hh).toFixed(1)}" width="${w.toFixed(2)}" height="${hh.toFixed(1)}" fill="${fill}" ${q.est?'stroke="var(--bar)" stroke-width="1" vector-effect="non-scaling-stroke"':''} opacity="${inSide?1:.4}"/>`;
    if(note)s+=`<rect x="${x.toFixed(2)}" y="${(H-bot+1).toFixed(1)}" width="${w.toFixed(2)}" height="2" fill="${i===sel?'var(--hi)':'var(--M)'}" opacity="${inSide?.8:.35}"/>`;
  });
  svg.innerHTML=s;
  const q=Q[sel];
  $('#capR').textContent=q?`${q.day}.${q.m}.${yy(q.y)} · ${q.shownUnits} units${q.est?' (estimated)':''}`:'1961 – 1990';
  $('#capL').textContent=q&&q.e.n?'marked: a note in the margin':'units each quarter; marks below are notes';
}

function select(i,scroll){
  sel=i;
  const want=i>=SIDE_SPLIT?1:0;
  if(want!==side){side=want;}
  if(scroll&&$('#only').checked&&!Q[i].e.n){$('#only').checked=false;$('#card').classList.remove('hide-plain');}
  render();
  if(scroll){const r=document.querySelector(`tr.q[data-i="${i}"]`);if(r)r.scrollIntoView({block:'center',behavior:'smooth'});}
}

$('#ch').addEventListener('click',ev=>{
  const r=ev.currentTarget.getBoundingClientRect();
  const i=Math.max(0,Math.min(Q.length-1,Math.floor((ev.clientX-r.left)/r.width*Q.length)));
  select(i,true);
});
$('#rows').addEventListener('click',ev=>{const tr=ev.target.closest('tr');if(tr)select(+tr.dataset.i,false)});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{side=+t.dataset.side;render()}));
$('#only').addEventListener('change',e=>$('#card').classList.toggle('hide-plain',e.target.checked));
$('#key').innerHTML=Object.entries(HANDS).map(([k,v])=>`<span><b class="h-${k}">${k==='J'?'J.P.':k==='K'?'K.A.':k}</b> ${v}</span>`).join('');

render();
addEventListener('resize',()=>chart());
window.__readings={Q,EV,select,render,start};
})();
</script>
</body>
</html>
