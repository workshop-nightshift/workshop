<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A city, visited</title>
<style>
:root{--water:#c9d8dc;--bg:#f3efe6;--block:#e7e0d1;--mark:#dcd1bb;--green:#cfd8bf;--fg:#1d1b18;--mute:#7a7366;--line:#d8d1c2;--street:#3a352e;--new:#b4472b;--hi:#2f6f8f}
@media (prefers-color-scheme:dark){:root{--water:#1c2a31;--bg:#111214;--block:#1b1c1f;--mark:#26262a;--green:#1d2620;--fg:#e8e5de;--mute:#999488;--line:#2a2b2e;--street:#c9c3b6;--new:#e58a63;--hi:#7fb7d4}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg)}
body{display:flex;flex-direction:column;font:14px/1.5 ui-monospace,Menlo,monospace}
header{padding:12px 16px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
h1{font:600 17px/1.2 ui-serif,Georgia,serif;margin:0}
#count{color:var(--mute)}
canvas{flex:1;width:100%;min-height:0;display:block;touch-action:manipulation}
#info{min-height:1.5em;padding:4px 16px;font-family:ui-serif,Georgia,serif;font-size:16px}
footer{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding:6px 16px 14px;color:var(--mute);border-top:1px solid var(--line)}
button{font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--fg);background:none;border:1px solid var(--line);border-radius:4px;padding:2px 10px;cursor:pointer}
a{color:inherit}
</style>
</head>
<body>
<header><h1 id="name">A city</h1><span id="count"></span></header>
<canvas id="c" aria-label="A street map of a small city that grows a little each time the page is opened"></canvas>
<div id="info" aria-live="polite"></div>
<footer>
  <span><a href="../../">← shelf</a> · tap a street or a place for its name</span>
  <span><button id="again" title="The city grows when you come back. This pretends you did.">pretend a day has passed</button> <button id="reset">found a new city</button></span>
</footer>
<script>
const $ = id => document.getElementById(id);
const c = $("c"), x = c.getContext("2d");
const KEY = "nightshift-city-v2";

// ---- seeded randomness ----
function rng(seed) {
  let s = seed >>> 0 || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
const pick = (r, a) => a[Math.floor(r() * a.length)];

// ---- names ----
const ON = ["Ash","Bram","Cal","Dun","Ell","Fen","Gar","Hol","Ivy","Kel","Lark","Mar","Nor","Ord","Pell","Quill","Ros","Sal","Tam","Ux","Vey","Wren","Yar"];
const MID = ["","","","en","er","in","ow","ley","ing","s"];
const END = ["ford","mere","wick","holm","by","gate","stead","combe","haven","more"];
const SUF = ["Street","Lane","Row","Walk","Road","Way","Hill","Passage","Terrace","Steps"];
const word = r => pick(r, ON) + pick(r, MID);
const cityName = r => pick(r, ON) + pick(r, END);

// ---- geometry ----
function segX(ax, ay, bx, by, cx, cy, dx, dy) {
  const d = (bx - ax) * (dy - cy) - (by - ay) * (dx - cx);
  if (Math.abs(d) < 1e-9) return null;
  const t = ((cx - ax) * (dy - cy) - (cy - ay) * (dx - cx)) / d;
  const u = ((cx - ax) * (by - ay) - (cy - ay) * (bx - ax)) / d;
  return t > 1e-6 && t < 1 - 1e-6 && u > 1e-6 && u < 1 - 1e-6 ? { t, u } : null;
}
function distSeg(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay, l = vx * vx + vy * vy;
  let t = l ? ((px - ax) * vx + (py - ay) * vy) / l : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - ax - t * vx, py - ay - t * vy);
}

// ---- water ----
// A river or a coast, fixed at founding. It's a wavy line in a rotated frame:
// u runs along it, v across. The founding square at (0, 0) is always dry.
function makeWater(r) {
  const roll = r();
  if (roll < 0.2) return null;
  const kind = roll < 0.65 ? "river" : "coast";
  const theta = r() * Math.PI, cs = Math.cos(theta), sn = Math.sin(theta);
  const a1 = 10 + r() * 14, l1 = 60 + r() * 60, p1 = r() * 7;
  const a2 = 3 + r() * 6, l2 = 18 + r() * 20, p2 = r() * 7;
  const w = 14 + r() * 8;
  const side = r() < 0.5 ? 1 : -1;
  const c = kind === "river" ? side * (a1 + a2 + w / 2 + 10 + r() * 45) : side * (a1 + a2 + 30 + r() * 60);
  const mid = u => c + a1 * Math.sin(u / l1 + p1) + a2 * Math.sin(u / l2 + p2);
  const uv = (px, py) => [px * cs + py * sn, -px * sn + py * cs];
  const xy = (u, v) => [u * cs - v * sn, u * sn + v * cs];
  const wet = (px, py) => {
    const [u, v] = uv(px, py), m = mid(u);
    return kind === "river" ? Math.abs(v - m) < w / 2 : (v - m) * side > 0;
  };
  const n1 = word(r);
  const wname = kind === "river" ? pick(r, ["the River " + n1, "the " + n1 + " Water", "the " + n1 + "brook"])
                                 : pick(r, [n1 + " Bay", n1 + " Sound", "the " + n1 + " Reach"]);
  return { kind, theta, w, side, mid, xy, wet, name: wname };
}

// ---- the city ----
function build(seed, visits) {
  const nodes = [{ x: 0, y: 0 }], edges = [], streets = [];
  const nr = rng(seed * 7 + 3);
  const name = cityName(nr);
  const water = makeWater(nr);
  const adj = [[]];
  const addNode = (px, py) => { nodes.push({ x: px, y: py }); adj.push([]); return nodes.length - 1; };
  const addEdge = (a, b, street, visit, bridge) => { edges.push({ a, b, street, visit, bridge: !!bridge }); const i = edges.length - 1; adj[a].push(i); adj[b].push(i); return i; };
  const newStreet = r => {
    let n, tries = 0;
    do { n = word(r) + " " + pick(r, SUF); } while (streets.some(s => s.name === n) && tries++ < 20);
    streets.push({ name: n }); return streets.length - 1;
  };
  // Split edge e at a new node k.
  const split = (e, k) => {
    const E = edges[e], b = E.b;
    adj[b] = adj[b].filter(i => i !== e);
    E.b = k; adj[k].push(e);
    addEdge(k, b, E.street, E.visit, E.bridge);
  };

  function tryGrow(r, visit) {
    // Prefer recent nodes with spare junction capacity.
    const n = nodes.length;
    let from = -1;
    for (let t = 0; t < 8; t++) {
      const i = Math.min(n - 1, Math.floor(n * Math.pow(r(), 0.8)));
      if (adj[i].length < 4) { from = i; break; }
    }
    if (from < 0) return false;
    const F = nodes[from];
    let ang, street;
    const out = adj[from];
    if (!out.length) { ang = r() * Math.PI * 2; street = -1; }
    else {
      const e = edges[pick(r, out)], o = e.a === from ? nodes[e.b] : nodes[e.a];
      const base = Math.atan2(F.y - o.y, F.x - o.x);
      const straight = out.length === 1 && r() < 0.55;
      if (straight) { ang = base + (r() - 0.5) * 0.35; street = e.street; }
      else {
        ang = base + (r() < 0.5 ? 1 : -1) * Math.PI / 2 + (r() - 0.5) * 0.25;
        // A turn off the end of a street usually keeps its name (streets bend);
        // a branch off the middle is always a new street.
        street = out.length === 1 && r() < 0.6 ? e.street : -1;
      }
    }
    // Name a new street only once something is actually built.
    // A short link into an existing street either carries on a street it lines
    // up with, or stays a passage with no name.
    const lay = (a, b, into) => {
      if (street < 0 && into) {
        const dx = nodes[b].x - nodes[a].x, dy = nodes[b].y - nodes[a].y, dl = Math.hypot(dx, dy);
        for (const i of adj[b]) {
          const o = edges[i].a === b ? nodes[edges[i].b] : nodes[edges[i].a];
          const ex = o.x - nodes[b].x, ey = o.y - nodes[b].y;
          if ((dx * ex + dy * ey) / (dl * Math.hypot(ex, ey)) > 0.85 && streets[edges[i].street].name) { street = edges[i].street; break; }
        }
        if (street < 0) { streets.push({ name: null }); street = streets.length - 1; }
      }
      if (street < 0) street = newStreet(r);
      addEdge(a, b, street, visit, bridge); return true;
    };
    let len = 26 + r() * 30, bridge = false;
    let tx = F.x + Math.cos(ang) * len, ty = F.y + Math.sin(ang) * len;

    // Don't leave at a too-sharp angle to an existing street from this node.
    for (const i of out) {
      const o = edges[i].a === from ? nodes[edges[i].b] : nodes[edges[i].a];
      let d = Math.abs(Math.atan2(o.y - F.y, o.x - F.x) - ang) % (Math.PI * 2);
      if (d > Math.PI) d = Math.PI * 2 - d;
      if (d < 0.9) return false;
    }
    // Water: a street stops at the bank, or now and then crosses on a bridge.
    if (water) {
      const steps = Math.ceil(len / 2.5);
      let first = -1, last = -1;
      for (let k = 1; k <= steps; k++) {
        const t = k / steps;
        if (water.wet(F.x + (tx - F.x) * t, F.y + (ty - F.y) * t)) { if (first < 0) first = k; last = k; }
      }
      if (first >= 0) {
        const across = water.kind === "river" && last < steps - 1 && r() < 0.3;
        if (across) {
          // Bridges go straight over, roughly square to the river.
          let d = Math.abs(ang - water.theta - Math.PI / 2) % Math.PI;
          if (d > Math.PI / 2) d = Math.PI - d;
          if (d > 0.45) return false;
          bridge = true;
        } else {
          const keep = (first - 1) / steps * len - 5;
          if (keep < 14) return false;
          len = keep;
          tx = F.x + Math.cos(ang) * len; ty = F.y + Math.sin(ang) * len;
        }
      }
    }
    // First crossing: stop there and make a T junction.
    let hit = null;
    for (let i = 0; i < edges.length; i++) {
      const E = edges[i];
      if (E.a === from || E.b === from) continue;
      const A = nodes[E.a], B = nodes[E.b];
      const h = segX(F.x, F.y, tx, ty, A.x, A.y, B.x, B.y);
      if (h && (!hit || h.t < hit.t)) hit = { ...h, e: i };
    }
    if (hit) {
      if (hit.t * len < 12 || edges[hit.e].bridge || bridge) return false;
      const E = edges[hit.e], A = nodes[E.a], B = nodes[E.b];
      const elen = Math.hypot(B.x - A.x, B.y - A.y);
      // Snap to an end if the crossing is near one.
      if (hit.u * elen < 8) { if (adj[E.a].length >= 4) return false; return lay(from, E.a, true); }
      if ((1 - hit.u) * elen < 8) { if (adj[E.b].length >= 4) return false; return lay(from, E.b, true); }
      const k = addNode(A.x + (B.x - A.x) * hit.u, A.y + (B.y - A.y) * hit.u);
      split(hit.e, k);
      return lay(from, k, true);
    }
    // Snap to a nearby node to close loops.
    for (let i = 0; i < nodes.length; i++) {
      if (i === from) continue;
      if (Math.hypot(nodes[i].x - tx, nodes[i].y - ty) < 13) {
        if (adj[i].length >= 4 || adj[from].some(e => edges[e].a === i || edges[e].b === i)) return false;
        return lay(from, i, true);
      }
    }
    // Keep clear of other streets.
    for (const E of edges) {
      if (E.a === from || E.b === from) continue;
      const A = nodes[E.a], B = nodes[E.b];
      if (distSeg(tx, ty, A.x, A.y, B.x, B.y) < 11) return false;
    }
    return lay(from, addNode(tx, ty));
  }

  for (let v = 1; v <= visits; v++) {
    const r = rng(seed + v * 2654435761);
    const want = v === 1 ? 34 : 9 + Math.floor(r() * 7);
    let got = 0, tries = 0;
    while (got < want && tries++ < want * 40) if (tryGrow(r, v)) got++;
  }
  const city = { name, water, nodes, edges, streets };
  city.blocks = findBlocks(city);
  placeLandmarks(city, seed, visits);
  return city;
}

// ---- blocks ----
// Closed faces of the street graph. Each half-edge u→v continues out of v along
// the next edge clockwise from v→u; following that until it returns traces one
// face. The face with the largest area is the outside, and has the other sign.
function inPoly(px, py, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function findBlocks({ nodes, edges, water }) {
  const out = nodes.map(() => []);
  edges.forEach((E, i) => { out[E.a].push(2 * i); out[E.b].push(2 * i + 1); });
  const from = h => h & 1 ? edges[h >> 1].b : edges[h >> 1].a;
  const to = h => h & 1 ? edges[h >> 1].a : edges[h >> 1].b;
  const ang = h => { const A = nodes[from(h)], B = nodes[to(h)]; return Math.atan2(B.y - A.y, B.x - A.x); };
  for (const o of out) o.sort((p, q) => ang(p) - ang(q));
  const seen = new Uint8Array(edges.length * 2), faces = [];
  for (let h0 = 0; h0 < seen.length; h0++) {
    if (seen[h0]) continue;
    const pts = [];
    let h = h0, bridge = false, guard = 0;
    while (!seen[h] && guard++ < 5000) {
      seen[h] = 1;
      if (edges[h >> 1].bridge) bridge = true;
      const v = to(h), n = nodes[v];
      pts.push([n.x, n.y]);
      const o = out[v], k = o.indexOf(h ^ 1);
      h = o[(k - 1 + o.length) % o.length];
    }
    let a = 0;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) a += pts[j][0] * pts[i][1] - pts[i][0] * pts[j][1];
    faces.push({ pts, area: a / 2, bridge });
  }
  if (!faces.length) return [];
  const outer = faces.reduce((m, f) => Math.abs(f.area) > Math.abs(m.area) ? f : m);
  const sgn = Math.sign(outer.area);
  return faces.filter(f => f !== outer && Math.sign(f.area) === -sgn && Math.abs(f.area) > 150 && !f.bridge &&
    !(water && wetInside(f, water))).map(f => {
      let cx = 0, cy = 0;
      for (const [px, py] of f.pts) { cx += px; cy += py; }
      return { pts: f.pts, area: Math.abs(f.area), cx: cx / f.pts.length, cy: cy / f.pts.length, mark: null };
    });
}
// A face that wraps a bit of shore isn't a block.
function wetInside(f, water) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [px, py] of f.pts) { x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py); }
  for (let i = 1; i < 8; i++) for (let j = 1; j < 8; j++) {
    const px = x0 + (x1 - x0) * i / 8, py = y0 + (y1 - y0) * j / 8;
    if (inPoly(px, py, f.pts) && water.wet(px, py)) return true;
  }
  return false;
}

// ---- landmarks ----
// Each city has a few places fixed at founding: a seeded point and a kind. A
// landmark appears once the streets close a block around its point, so it
// arrives on some visit and then stays put while the city grows around it.
function placeLandmarks(city, seed, visits) {
  const r = rng(seed * 31 + 17);
  const saint = pick(r, ON) + pick(r, ["a", "ia", "an", "el", "ard"]);
  const kinds = [
    { kind: "square", name: pick(r, ON) + pick(r, MID) + " Square" },
    { kind: "church", name: "St " + saint + "'s" },
    { kind: "market", name: pick(r, ["the Corn Market", "the Fish Market", "the Old Market", "the Hay Market", "the Cloth Hall"]) },
    { kind: "school", name: pick(r, ["the Free School", "the Grammar School", "the Lyceum", "the Board School"]) },
    { kind: "garden", name: pick(r, ["the Physic Garden", "the Bowling Green", "the Common", "the Infirmary Garden"]) },
  ];
  // Shuffle so different cities find different things first.
  for (let i = kinds.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [kinds[i], kinds[j]] = [kinds[j], kinds[i]]; }
  let rad = 15;
  const list = [];
  for (const L of kinds) {
    rad += 12 + r() * 22;
    // Places stand on dry land: try a few bearings for one that is.
    let px = 0, py = 0;
    for (let t = 0; t < 12; t++) {
      const a = r() * Math.PI * 2;
      px = Math.cos(a) * rad; py = Math.sin(a) * rad;
      if (!city.water || !city.water.wet(px, py)) break;
    }
    list.push({ L, px, py });
  }
  // A place still unenclosed by visit 10 stops waiting: it moves to the middle
  // of the nearest free block of the city as it was at visit 10. Growth is a
  // prefix, so that choice is the same on every later visit and the place
  // stays put once it arrives.
  if (visits >= 10) {
    const b10 = visits === 10 ? city.blocks : build(seed, 10).blocks;
    const taken = new Set();
    const late = list.filter(m => {
      const b = b10.find(b => !taken.has(b) && b.area > 400 && inPoly(m.px, m.py, b.pts));
      if (b) taken.add(b);
      return !b;
    });
    for (const m of late) {
      let best = null, bd = 1e9;
      for (const b of b10) {
        if (taken.has(b) || b.area <= 400 || !inPoly(b.cx, b.cy, b.pts)) continue;
        if (list.some(o => inPoly(o.px, o.py, b.pts))) continue;
        const d = Math.hypot(b.cx - m.px, b.cy - m.py);
        if (d < bd) { bd = d; best = b; }
      }
      if (best && bd < 90) { taken.add(best); m.px = best.cx; m.py = best.cy; m.late = true; }
    }
  }
  for (const { L, px, py, late } of list) {
    const b = city.blocks.find(b => !b.mark && b.area > (late ? 200 : 400) && inPoly(px, py, b.pts));
    if (!b) continue;
    b.mark = { ...L, px, py };
    if (!inPoly(b.cx, b.cy, b.pts)) { b.cx = px; b.cy = py; }
  }
}

// ---- since last visit ----
// Growth is deterministic, so the city as it was last time is a prefix of the
// city now: same streets at the same indices, older edges keep their visit.
// Compare the two and say the most interesting few things, gazetteer voice.
const COMPASS = ["east", "south-east", "south", "south-west", "west", "north-west", "north", "north-east"];
const compass = (dx, dy) => COMPASS[((Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) % 8) + 8) % 8];
const cap = t => t.replace(/^the/, "The");
function sinceNote(prev, cur, visit) {
  const r = rng(visit * 977 + cur.nodes.length);
  const len = E => { const A = cur.nodes[E.a], B = cur.nodes[E.b]; return Math.hypot(B.x - A.x, B.y - A.y); };
  // Centre of the town as it was.
  let ox = 0, oy = 0;
  for (const n of prev.nodes) { ox += n.x; oy += n.y; }
  ox /= prev.nodes.length; oy /= prev.nodes.length;
  const nearWater = n => cur.water && [0, 1, 2, 3, 4, 5, 6, 7].some(k =>
    cur.water.wet(n.x + Math.cos(k * Math.PI / 4) * 13, n.y + Math.sin(k * Math.PI / 4) * 13));
  const shore = !cur.water ? "" : cur.water.kind === "river" ? cur.water.name : "the shore";
  const placeNear = n => cur.blocks.find(b => b.mark && Math.hypot(b.cx - n.x, b.cy - n.y) < 30);

  // New edges, grouped by street.
  const by = new Map();
  for (const E of cur.edges) if (E.visit === visit) {
    if (!by.has(E.street)) by.set(E.street, []);
    by.get(E.street).push(E);
  }
  const lines = [];
  // Places that turned up.
  const had = new Set(prev.blocks.filter(b => b.mark).map(b => b.mark.name));
  for (const b of cur.blocks) if (b.mark && !had.has(b.mark.name)) {
    const n = cap(b.mark.name), k = b.mark.kind;
    lines.push({ w: 100, t: k === "square" ? `${n} has been laid out.`
      : k === "church" ? pick(r, [`${n} has been found among the new streets.`, `${n} now has streets on every side.`])
      : k === "market" ? `${n} has opened.`
      : k === "school" ? `${n} has opened its doors.`
      : pick(r, [`${n} has been walled in.`, `${n} is enclosed at last.`]) });
  }
  for (const [si, es] of by) {
    const st = cur.streets[si], total = es.reduce((a, E) => a + len(E), 0);
    // The far end of the new work: the new node farthest from the old centre.
    let far = null, fd = -1;
    for (const E of es) for (const k of [E.a, E.b]) {
      const n = cur.nodes[k], d = Math.hypot(n.x - ox, n.y - oy);
      if (k >= prev.nodes.length && d > fd) { fd = d; far = n; }
    }
    if (es.some(E => E.bridge) && cur.water) {
      lines.push({ w: 90, t: st.name ? `${st.name} now crosses ${cur.water.name} on a bridge.` : `A footbridge now crosses ${cur.water.name}.` });
      continue;
    }
    if (!st.name) continue;
    const fresh = si >= prev.streets.length;
    if (!far) {
      // Nothing new at the end: it was a link through to an older street.
      const ends = new Set(es.flatMap(E => [E.a, E.b]));
      const other = cur.edges.find(E => E.street !== si && cur.streets[E.street].name && (ends.has(E.a) || ends.has(E.b)));
      if (other) lines.push({ k: fresh ? "new" : "ext", w: 20 + total / 4, t: fresh
        ? `${st.name} was cut through to meet ${cur.streets[other.street].name}.`
        : `${st.name} was carried on to meet ${cur.streets[other.street].name}.` });
      continue;
    }
    const lm = far && placeNear(far);
    const where = !far ? "" : nearWater(far) ? ` toward ${shore}` : lm ? ` toward ${lm.mark.name}` : "";
    if (fresh) {
      const dir = far ? compass(far.x - ox, far.y - oy) : "";
      lines.push({ k: "new", w: 40 + total / 4 + (where ? 15 : 0), t: where
        ? pick(r, [`${st.name} was laid out${where}.`, `A new street, ${st.name}, runs${where}.`])
        : pick(r, [`${st.name} was laid out on the ${dir} side.`, `A new street, ${st.name}, on the ${dir} side.`]) });
    } else {
      // Which way it went: from the old part of the street to the new.
      let qx = 0, qy = 0, m = 0;
      for (const E of cur.edges) if (E.street === si && E.visit < visit) { const A = cur.nodes[E.a]; qx += A.x; qy += A.y; m++; }
      const dir = far && m ? compass(far.x - qx / m, far.y - qy / m) : "";
      lines.push({ k: "ext", w: 30 + total / 4 + (where ? 15 : 0), t: where
        ? pick(r, [`${st.name} was carried on${where}.`, `${st.name} has been extended${where}.`])
        : pick(r, [`${st.name} was carried on to the ${dir}.`, `${st.name} goes further ${dir} now.`]) });
    }
  }
  if (!lines.length) {
    const any = cur.edges.some(E => E.visit === visit);
    return any ? "A few passages have been cut between the streets." : "Nothing has changed since you were last here.";
  }
  lines.sort((a, b) => b.w - a.w);
  // At most one sentence about a new street and one about an extension, unless
  // there's nothing else to say.
  const out = [];
  for (const L of lines) if (out.length < 3 && !(L.k && out.some(o => o.k === L.k))) out.push(L);
  // If only one kind of sentence survived and there's room, allow a second.
  for (const L of lines) if (out.length < 2 && !out.includes(L)) out.push(L);
  return out.map(o => o.t).join(" ");
}

// ---- state ----
let state = { seed: 0, visits: 0 };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.seed) state = s; } catch {}
if (!state.seed) state.seed = (Math.random() * 4294967295) >>> 0 || 1;
state.visits++;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
save();

let city, view, sel = -1, selB = null, note = "";
function regen() {
  city = build(state.seed, state.visits);
  note = state.visits === 1 ? "Founded today. Come back another time; it will have grown."
    : sinceNote(build(state.seed, state.visits - 1), city, state.visits);
  sel = -1; selB = null;
  $("name").textContent = city.name;
  const fresh = city.edges.filter(e => e.visit === state.visits).length;
  $("count").textContent = `visit ${state.visits} · ${city.streets.filter(t => t.name).length} streets` + (state.visits > 1 ? ` · ${fresh} new stretches since you were last here` : "");
  $("info").textContent = note;
  draw();
}

function colors() {
  const s = getComputedStyle(document.documentElement);
  return k => s.getPropertyValue(k).trim();
}
function draw() {
  const dpr = devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
  c.width = W * dpr; c.height = H * dpr;
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const col = colors();
  x.fillStyle = col("--bg"); x.fillRect(0, 0, W, H);
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  for (const n of city.nodes) { minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x); minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y); }
  const pad = 28, sc = Math.min((W - pad * 2) / Math.max(maxX - minX, 120), (H - pad * 2) / Math.max(maxY - minY, 120), 3);
  const ox = W / 2 - (minX + maxX) / 2 * sc, oy = H / 2 - (minY + maxY) / 2 * sc;
  view = { sc, ox, oy };
  const P = n => [n.x * sc + ox, n.y * sc + oy];
  x.lineCap = "round"; x.lineJoin = "round";
  const lw = Math.max(1.2, Math.min(3.2, sc * 1.6));
  const Wt = city.water;
  if (Wt) {
    const span = (Math.hypot(W, H) / sc) + Math.hypot(minX + maxX, minY + maxY);
    const cu = ((minX + maxX) / 2) * Math.cos(Wt.theta) + ((minY + maxY) / 2) * Math.sin(Wt.theta);
    const pts = [];
    for (let u = cu - span; u <= cu + span; u += 3) pts.push([u, Wt.mid(u)]);
    x.fillStyle = x.strokeStyle = col("--water");
    x.beginPath();
    if (Wt.kind === "river") {
      pts.forEach(([u, v], i) => { const [wx, wy] = Wt.xy(u, v); i ? x.lineTo(wx * sc + ox, wy * sc + oy) : x.moveTo(wx * sc + ox, wy * sc + oy); });
      x.lineWidth = Wt.w * sc; x.stroke();
    } else {
      pts.forEach(([u, v], i) => { const [wx, wy] = Wt.xy(u, v); i ? x.lineTo(wx * sc + ox, wy * sc + oy) : x.moveTo(wx * sc + ox, wy * sc + oy); });
      for (const [u, v] of [[cu + span, Wt.mid(cu + span) + Wt.side * span * 2], [cu - span, Wt.mid(cu - span) + Wt.side * span * 2]]) {
        const [wx, wy] = Wt.xy(u, v); x.lineTo(wx * sc + ox, wy * sc + oy);
      }
      x.closePath(); x.fill();
    }
    // Bridges: a little deck in the paper colour under the street.
    x.strokeStyle = col("--bg"); x.lineWidth = lw + 6; x.lineCap = "butt";
    for (const E of city.edges) if (E.bridge) {
      const [ax, ay] = P(city.nodes[E.a]), [bx, by] = P(city.nodes[E.b]);
      x.beginPath(); x.moveTo(ax, ay); x.lineTo(bx, by); x.stroke();
    }
    x.lineCap = "round";
  }
  drawBlocks(P, sc, lw, col);
  for (const pass of [0, 1, 2]) {
    for (let i = 0; i < city.edges.length; i++) {
      const E = city.edges[i];
      const isNew = E.visit === state.visits && state.visits > 1;
      const isSel = sel >= 0 && E.street === sel;
      if ((pass === 0) !== (!isNew && !isSel) || (pass === 1 && !isNew) || (pass === 2 && !isSel)) continue;
      const [ax, ay] = P(city.nodes[E.a]), [bx, by] = P(city.nodes[E.b]);
      x.strokeStyle = isSel ? col("--hi") : isNew ? col("--new") : col("--street");
      x.lineWidth = isSel ? lw + 1.5 : lw;
      x.beginPath(); x.moveTo(ax, ay); x.lineTo(bx, by); x.stroke();
    }
  }
  drawLabels(P, sc, lw, col, W, H);
}

// ---- labels ----
// Each named street is chained into polylines; its longest nearly straight run
// carries the name, set beside the street, reading left to right. Longest
// streets go first; a label that would collide with one already placed, or with
// a place's mark, is dropped.
function streetRuns(P) {
  const by = new Map();
  city.edges.forEach((E, i) => { if (city.streets[E.street].name) { if (!by.has(E.street)) by.set(E.street, []); by.get(E.street).push(i); } });
  const out = [];
  for (const [st, es] of by) {
    const inc = new Map(), used = new Set();
    const add = (n, e) => { if (!inc.has(n)) inc.set(n, []); inc.get(n).push(e); };
    let world = 0;
    for (const e of es) { const E = city.edges[e]; add(E.a, e); add(E.b, e); world += Math.hypot(city.nodes[E.a].x - city.nodes[E.b].x, city.nodes[E.a].y - city.nodes[E.b].y); }
    const starts = [...inc.keys()].sort((p, q) => inc.get(p).length - inc.get(q).length);
    const runs = [];
    for (const s of starts) {
      for (const e0 of inc.get(s)) {
        if (used.has(e0)) continue;
        // Walk a chain from s.
        const line = [s];
        let n = s, e = e0;
        while (e != null && !used.has(e)) {
          used.add(e);
          const E = city.edges[e]; n = E.a === n ? E.b : E.a; line.push(n);
          e = (inc.get(n) || []).find(f => !used.has(f));
        }
        // Split the chain into nearly straight runs.
        const pts = line.map(k => P(city.nodes[k]));
        let i0 = 0;
        for (let i = 1; i < pts.length; i++) {
          const a0 = Math.atan2(pts[i0 + 1][1] - pts[i0][1], pts[i0 + 1][0] - pts[i0][0]);
          const a1 = i + 1 < pts.length ? Math.atan2(pts[i + 1][1] - pts[i][1], pts[i + 1][0] - pts[i][0]) : null;
          let d = a1 == null ? 9 : Math.abs(a1 - a0);
          if (d > Math.PI) d = Math.PI * 2 - d;
          if (d > 0.3) { runs.push([pts[i0], pts[i]]); i0 = i; }
        }
      }
    }
    let best = null, bl = 0;
    for (const [A, B] of runs) { const l = Math.hypot(B[0] - A[0], B[1] - A[1]); if (l > bl) { bl = l; best = [A, B]; } }
    if (best) out.push({ st, world, A: best[0], B: best[1], len: bl });
  }
  return out.sort((p, q) => q.world - p.world);
}

function drawLabels(P, sc, lw, col, W, H) {
  const fs = W < 520 ? 10 : 11;
  const taken = []; // circles [x, y, r] already occupied
  const segs = city.edges.map(E => [...P(city.nodes[E.a]), ...P(city.nodes[E.b])]);
  const free = cs => cs.every(([px, py, pr]) => px - pr > 2 && px + pr < W - 2 && py - pr > 2 && py + pr < H - 2 &&
    taken.every(([qx, qy, qr]) => Math.hypot(px - qx, py - qy) > pr + qr) &&
    segs.every(([ax, ay, bx, by]) => distSeg(px, py, ax, ay, bx, by) > pr + lw / 2));
  const s = Math.max(6, Math.min(11, sc * 5));
  for (const b of city.blocks) if (b.mark) { const [cx, cy] = P({ x: b.cx, y: b.cy }); taken.push([cx, cy, s + 3]); }
  x.textBaseline = "middle"; x.textAlign = "center";
  x.lineJoin = "round";
  const halo = (t, px, py) => { x.strokeStyle = col("--bg"); x.lineWidth = 3; x.strokeText(t, px, py); x.fillText(t, px, py); };
  // Water first, in italic, in the middle of what's visible.
  if (city.water) {
    x.font = `italic ${fs + 1}px ui-serif,Georgia,serif`;
    const t = city.water.name.replace(/^the /, "The "), tw = x.measureText(t).width;
    const Wt = city.water;
    // Walk along the water's middle line and take the first spot where the name fits on screen.
    const cu = ((W / 2 - view.ox) / sc) * Math.cos(Wt.theta) + ((H / 2 - view.oy) / sc) * Math.sin(Wt.theta);
    for (let k = 0; k < 40; k++) {
      const u = cu + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 12;
      const v = Wt.kind === "river" ? Wt.mid(u) : Wt.mid(u) + Wt.side * (14 + fs / sc);
      const [wx, wy] = Wt.xy(u, v), [wx2, wy2] = Wt.xy(u + 1, Wt.kind === "river" ? Wt.mid(u + 1) : Wt.mid(u + 1) + Wt.side * (14 + fs / sc));
      let a = Math.atan2(wy2 - wy, wx2 - wx);
      if (a > Math.PI / 2) a -= Math.PI; else if (a < -Math.PI / 2) a += Math.PI;
      const px = wx * sc + view.ox, py = wy * sc + view.oy;
      const cs = [];
      for (let d = -tw / 2; d <= tw / 2; d += fs * 0.8) cs.push([px + Math.cos(a) * d, py + Math.sin(a) * d, fs * 0.6]);
      if (!free(cs)) continue;
      taken.push(...cs);
      x.save(); x.translate(px, py); x.rotate(a); x.fillStyle = col("--mute");
      x.strokeStyle = col("--water"); x.lineWidth = 3; x.strokeText(t, 0, 0); x.fillText(t, 0, 0);
      x.restore();
      break;
    }
  }
  x.font = `${fs}px ui-serif,Georgia,serif`;
  let placed = 0;
  const max = W < 520 ? 7 : 12;
  for (const R of streetRuns(P)) {
    if (placed >= max) break;
    if (R.st === sel) continue;
    const t = city.streets[R.st].name, tw = x.measureText(t).width;
    if (tw > R.len * 0.92) continue;
    let [A, B] = [R.A, R.B];
    if (B[0] < A[0]) [A, B] = [B, A];
    const a = Math.atan2(B[1] - A[1], B[0] - A[0]);
    const nx = -Math.sin(a), ny = Math.cos(a), off = lw / 2 + fs * 0.5 + 1;
    const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2;
    let done = false;
    // Try either side, and a little up and down the run.
    for (const shift of [0, -0.15, 0.15, -0.3, 0.3, -0.45, 0.45]) for (const side of [-1, 1]) {
      if (done) break;
      const px = mx + Math.cos(a) * shift * (R.len - tw) + nx * off * side;
      const py = my + Math.sin(a) * shift * (R.len - tw) + ny * off * side;
      const cs = [];
      for (let d = -tw / 2; d <= tw / 2; d += fs * 0.7) cs.push([px + Math.cos(a) * d, py + Math.sin(a) * d, fs * 0.4]);
      if (!free(cs)) continue;
      taken.push(...cs);
      x.save(); x.translate(px, py); x.rotate(a); x.fillStyle = col("--mute"); halo(t, 0, 0); x.restore();
      placed++; done = true;
    }
  }
  // Names of the places, small italic, beside the mark if there's room.
  x.font = `italic ${fs}px ui-serif,Georgia,serif`;
  for (const b of city.blocks) if (b.mark) {
    const [cx, cy] = P({ x: b.cx, y: b.cy });
    const t = b.mark.name.replace(/^the /, ""), tw = x.measureText(t).width;
    for (const dy of [s + fs * 0.9, -(s + fs * 0.9)]) {
      const cs = [];
      for (let d = -tw / 2; d <= tw / 2; d += fs * 0.6) cs.push([cx + d, cy + dy, fs * 0.4]);
      // The place's own mark doesn't count against its name.
      const own = taken.findIndex(([qx, qy]) => qx === cx && qy === cy);
      const mine = own >= 0 ? taken.splice(own, 1)[0] : null;
      const ok = free(cs);
      if (mine) taken.push(mine);
      if (!ok) continue;
      taken.push(...cs);
      x.fillStyle = col("--fg"); halo(t, cx, cy + dy);
      break;
    }
  }
}

function drawBlocks(P, sc, lw, col) {
  const gap = Math.max(3, sc * 2.6);
  for (const b of city.blocks) {
    const m = b.mark, isSel = selB === b;
    x.beginPath();
    b.pts.forEach((p, i) => { const [qx, qy] = P({ x: p[0], y: p[1] }); i ? x.lineTo(qx, qy) : x.moveTo(qx, qy); });
    x.closePath();
    x.fillStyle = isSel ? col("--hi") : !m ? col("--block") : m.kind === "garden" ? col("--green") : col("--mark");
    if (isSel) { x.fillStyle = col("--mark"); x.fill(); x.globalAlpha = 0.4; x.fillStyle = col("--hi"); }
    x.fill(); x.globalAlpha = 1;
    x.strokeStyle = col("--bg"); x.lineWidth = lw + gap * 2; x.stroke();
  }
  // Small marks for the named places, in the margin colour.
  x.strokeStyle = x.fillStyle = col("--mute"); x.lineWidth = 1.6;
  const s = Math.max(6, Math.min(11, sc * 5));
  for (const b of city.blocks) if (b.mark) {
    const [cx, cy] = P({ x: b.cx, y: b.cy }), k = b.mark.kind;
    x.beginPath();
    if (k === "church") { x.moveTo(cx, cy - s); x.lineTo(cx, cy + s); x.moveTo(cx - s * 0.6, cy - s * 0.35); x.lineTo(cx + s * 0.6, cy - s * 0.35); x.stroke(); }
    else if (k === "market") { for (let i = -1; i <= 1; i++) for (let j = -1; j <= 0; j++) x.rect(cx + i * s * 0.7 - s * 0.25, cy + j * s * 0.7, s * 0.5, s * 0.5); x.fill(); }
    else if (k === "school") { x.moveTo(cx - s * 0.7, cy + s * 0.5); x.lineTo(cx, cy - s * 0.4); x.lineTo(cx + s * 0.7, cy + s * 0.5); x.closePath(); x.moveTo(cx, cy - s * 0.4); x.lineTo(cx, cy - s); x.stroke(); }
    else if (k === "square") { x.setLineDash([2, 3]); x.arc(cx, cy, s * 0.8, 0, Math.PI * 2); x.stroke(); x.setLineDash([]); }
    else { for (const [dx, dy] of [[-0.6, 0.2], [0.5, -0.3], [0.1, 0.6], [-0.1, -0.6]]) { x.moveTo(cx + dx * s + s * 0.22, cy + dy * s); x.arc(cx + dx * s, cy + dy * s, s * 0.22, 0, Math.PI * 2); } x.fill(); }
  }
}

c.addEventListener("click", ev => {
  const rct = c.getBoundingClientRect(), px = ev.clientX - rct.left, py = ev.clientY - rct.top;
  let best = -1, bd = 12;
  for (const E of city.edges) {
    const A = city.nodes[E.a], B = city.nodes[E.b];
    const d = distSeg(px, py, A.x * view.sc + view.ox, A.y * view.sc + view.oy, B.x * view.sc + view.ox, B.y * view.sc + view.oy);
    if (d < bd) { bd = d; best = E.street; }
  }
  sel = best === sel ? -1 : best;
  const wx = (px - view.ox) / view.sc, wy = (py - view.oy) / view.sc;
  const blk = sel < 0 ? city.blocks.find(b => b.mark && inPoly(wx, wy, b.pts)) : null;
  selB = blk && blk !== selB ? blk : null;
  $("info").textContent = sel >= 0 ? city.streets[sel].name || "a passage with no name"
    : selB ? cap(selB.mark.name)
    : city.water && city.water.wet(wx, wy) ? cap(city.water.name) : note;
  draw();
});
$("again").onclick = () => { state.visits++; save(); regen(); };
$("reset").onclick = () => {
  if (!confirm("Found a new city? This one will be forgotten.")) return;
  state = { seed: (Math.random() * 4294967295) >>> 0 || 1, visits: 1 }; save(); regen();
};
addEventListener("resize", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
regen();
</script>
</body>
</html>
