<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Small hours</title>
<style>
:root{--bg:#e9e7e1;--fg:#1f2326;--mute:#6a7078;--line:#c8c9c6;--sky:#26324a;--sky2:#3a4866;--hill:#121822;--sea:#1d2a40;--wall:#3b4352;--warm:#ffd98a;--fog:#c9d1de;--star:#f2f0e6;--accent:#23406b;--dawn:#8a9bb8;--dawn2:#e8b98f;--day:#b9c8da;--sun:#f6d7a4}
@media (prefers-color-scheme:dark){:root{--bg:#0f1114;--fg:#e2e4e6;--mute:#8d949c;--line:#2a2e34;--sky:#0c111b;--sky2:#151d2c;--hill:#05070a;--sea:#0d1420;--wall:#232934;--warm:#ffd98a;--fog:#7d8696;--star:#e8e6dc;--accent:#a9c0e6;--dawn:#2c3850;--dawn2:#8a6550;--day:#3b4a62;--sun:#c9a67a}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 Georgia,"Iowan Old Style",serif}
main{max-width:640px;margin:0 auto;padding:40px 16px 72px}
header h1{font-weight:normal;font-size:30px;line-height:1.2;margin:0 0 8px}
header p{color:var(--mute);font-style:italic;margin:0}
.dial{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:28px 0 0;padding:0;list-style:none}
@media (max-width:420px){.dial{grid-template-columns:repeat(8,1fr)}}
.dial button{width:100%;font:12px/1 ui-monospace,Menlo,monospace;color:var(--mute);background:transparent;border:1px dashed var(--line);border-radius:3px;padding:9px 0;cursor:pointer}
.dial button.done{color:var(--fg);border-style:solid}
.dial button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dial button.now::after{content:"·";display:block;height:0;line-height:.6;margin-top:-2px}
.dial button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hour{margin:24px 0 0}
.hour .when{font:12px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hour h2{font-weight:normal;font-size:22px;margin:16px 0 8px}
.hour p{margin:0 0 12px}
svg.scene{display:block;width:100%;height:auto;border-radius:3px;background:var(--sky)}
.blank{border:1px dashed var(--line);border-radius:3px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:var(--mute);font-style:italic;padding:16px;text-align:center}
.warm{fill:var(--warm)}
.glow{fill:var(--warm);opacity:.16}
.star{fill:var(--star)}
.hillc{fill:var(--hill)}
.seac{fill:var(--sea)}
.wallc{fill:var(--wall)}
.fogc{fill:var(--fog)}
.a-twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.9}50%{opacity:.3}}
.a-bob{animation:bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
.a-steam{animation:steam 6s linear infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes steam{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.55}100%{transform:translateY(-46px) scale(1.6);opacity:0}}
.a-drift{animation:drift 26s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(340px)}}
.a-cat{animation:cat 14s linear infinite}
@keyframes cat{0%,8%{transform:translateX(-30px)}55%,100%{transform:translateX(350px)}}
.a-swing{animation:swing 18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes swing{0%,15%{transform:rotate(-8deg)}85%,100%{transform:rotate(8deg)}}
.a-flick{animation:flick 7s steps(1) infinite}
@keyframes flick{0%,91%,95%,100%{opacity:1}93%{opacity:.35}}
.a-out{animation:out 30s linear infinite}
@keyframes out{from{transform:translateX(0)}to{transform:translateX(-300px)}}
.a-glide{animation:glide 16s ease-in-out infinite alternate}
@keyframes glide{0%{transform:translate(0,0)}50%{transform:translate(60px,-8px)}100%{transform:translate(120px,4px)}}
.a-flap{animation:flap 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.4)}}
.a-bell{animation:bell 2s ease-in-out infinite alternate;transform-box:view-box;transform-origin:160px 52px}
@keyframes bell{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.a-shutter{animation:shutter 12s ease-in-out infinite}
@keyframes shutter{0%,10%{transform:translateY(50px)}60%,100%{transform:translateY(0)}}
.a-walk{animation:walk 22s linear infinite}
@keyframes walk{0%{transform:translateX(0)}50%{transform:translateX(150px)}50.01%{transform:translateX(-150px)}100%{transform:translateX(0)}}
.a-step{animation:step .6s steps(2) infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes step{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}
.a-rise{animation:rise 10s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes rise{0%,8%{transform:scaleY(.08)}45%,100%{transform:scaleY(1)}}
.a-chalk{stroke-dasharray:60;animation:chalk 9s ease-in-out infinite}
@keyframes chalk{0%,15%{stroke-dashoffset:60}60%,100%{stroke-dashoffset:0}}
.a-flutter{animation:flutter 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
@keyframes flutter{from{transform:skewX(-7deg) scaleY(.96)}to{transform:skewX(9deg)}}
.a-shadow{animation:shadow 14s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes shadow{0%,10%{transform:scaleX(3.2)}70%,100%{transform:scaleX(1)}}
.a-hop{animation:hop 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes hop{0%,70%,100%{transform:translate(0,0)}78%{transform:translate(3px,-5px)}86%{transform:translate(6px,0)}93%{transform:translate(3px,-3px)}}
.a-breathe{animation:breathe 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.09)}}
.a-brush{animation:brush 1.8s ease-in-out infinite alternate}
@keyframes brush{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.a-fill{animation:fill 16s ease-in-out infinite}
@keyframes fill{0%,8%{transform:translateY(26px)}70%,100%{transform:translateY(0)}}
.a-light{animation:light 12s ease-in-out infinite backwards}
@keyframes light{0%,6%{opacity:.08}14%,92%{opacity:1}100%{opacity:.08}}
@media (prefers-reduced-motion:reduce){[class*="a-"]{animation:none!important}}
.foot{color:var(--mute);font-size:14px;font-style:italic;margin:28px 0 0}
footer{border-top:1px solid var(--line);margin-top:56px;padding-top:16px;color:var(--mute);font-size:14px}
a{color:inherit}
</style>
</head>
<body>
<main>
<header>
<h1>Small hours</h1>
<p>A clock for the coast town, one hour at a time. It opens on the hour it is where you are.</p>
</header>
<ul class="dial" id="dial" aria-label="Hours"></ul>
<section class="hour" id="hour" aria-live="polite"></section>
<p class="foot" id="foot"></p>
<footer><a href="../../workbench.html">← back to the workbench</a> · rough cut, hours still being written</footer>
</main>
<script>
(function(){
// Each written hour: title, scene (SVG inner markup, viewBox 0 0 320 180), lines.
var stars = function(n, seed, maxY){
  var s = seed, out = "";
  function r(){ s = (s * 9301 + 49297) % 233280; return s / 233280; }
  for (var i = 0; i < n; i++){
    var x = (r()*320).toFixed(1), y = (r()*maxY).toFixed(1), rad = (r()*.8+.3).toFixed(2);
    out += '<circle class="star' + (i % 4 === 0 ? ' a-twinkle' : '') + '" style="animation-delay:' + (r()*4).toFixed(1) + 's" cx="' + x + '" cy="' + y + '" r="' + rad + '"/>';
  }
  return out;
};
var HOURS = {
  0: {
    title: "The watch changes",
    scene: stars(40, 7, 90) +
      '<path class="hillc" d="M0 120 C60 96 110 70 170 74 C210 78 240 98 320 104 L320 180 L0 180Z"/>' +
      '<rect class="wallc" x="152" y="60" width="16" height="14"/>' +
      '<circle class="glow" cx="160" cy="64" r="12"/><rect class="warm a-flick" x="157" y="63" width="6" height="5"/>' +
      '<rect class="seac" x="0" y="128" width="320" height="52"/>' +
      '<g class="a-bob"><path class="hillc" d="M232 146 L262 146 L256 152 L238 152Z"/><circle class="glow" cx="250" cy="140" r="8"/><circle class="warm" cx="250" cy="141" r="1.8"/></g>',
    lines: [
      "Up at the watch-house, one watcher puts down the pen and another picks it up. Neither remembers yesterday; the drawer does that for them.",
      "Out past the Point a boat shows its lamp twice. The hill answers. Nobody down in the town is awake to see it, which is how it has always been done."
    ]
  },
  1: {
    title: "The first dough",
    scene: '<rect x="0" y="0" width="320" height="180" style="fill:var(--sky2)"/>' +
      '<rect class="wallc" x="40" y="40" width="240" height="140"/>' +
      '<path class="hillc" d="M30 40 L160 8 L290 40Z"/>' +
      '<rect class="glow" x="70" y="88" width="90" height="62"/><rect class="warm" x="78" y="96" width="74" height="46"/>' +
      '<path class="wallc" d="M115 96 v46 M78 119 h74" style="stroke:var(--wall);stroke-width:3"/>' +
      '<rect class="hillc" x="196" y="104" width="44" height="76"/>' +
      '<rect class="hillc" x="214" y="14" width="12" height="20"/>' +
      '<circle class="fogc a-steam" cx="220" cy="10" r="6"/><circle class="fogc a-steam" style="animation-delay:2s" cx="218" cy="10" r="5"/><circle class="fogc a-steam" style="animation-delay:4s" cx="222" cy="10" r="6"/>' +
      '<rect class="hillc" x="0" y="170" width="320" height="10"/>',
    lines: [
      "On Ropewalk Lane the baker's window is the only lit thing for three streets. The first dough is mixed by hand, because the machine wakes the flat upstairs.",
      "Steam goes out of the flue in slow white coins. Anyone walking home now will remember the smell and not the street."
    ]
  },
  2: {
    title: "The lowest hour",
    scene: '<rect class="wallc" x="0" y="30" width="70" height="150"/><rect class="wallc" x="250" y="50" width="70" height="130"/>' +
      '<rect class="hillc" x="0" y="150" width="320" height="30"/>' +
      '<rect class="hillc" x="158" y="70" width="3" height="80"/><path class="hillc" d="M150 70 h19 l-3 -6 h-13z"/>' +
      '<path class="glow" d="M152 72 L120 150 L200 150 L168 72Z"/><circle class="warm" cx="159.5" cy="72" r="2.4"/>' +
      '<g class="a-drift"><ellipse class="fogc" cx="40" cy="128" rx="70" ry="8" opacity=".28"/><ellipse class="fogc" cx="110" cy="140" rx="50" ry="6" opacity=".22"/></g>' +
      '<g class="a-cat"><path class="hillc" d="M10 150 q2 -9 10 -9 h8 l3 -4 l1 4 q3 1 3 5 v4 h-3 v-3 h-14 v3 h-3 q-6 -2 -8 -8 q4 3 3 8z"/></g>',
    lines: [
      "Two o'clock is the hour the town is most nearly empty. One lamp on the corner of Salt Street, and under it, for about a second, a cat.",
      "The fog comes up from the harbour in pieces, as if it were being carried. Nothing here is waiting for anything."
    ]
  },
  3: {
    title: "The tide turns",
    scene: stars(18, 31, 60) +
      '<rect class="seac" x="0" y="96" width="320" height="84"/>' +
      '<rect class="wallc" x="0" y="70" width="320" height="26"/>' +
      '<path style="stroke:var(--fog);stroke-width:1;opacity:.5" d="M0 104 H320"/>' +
      '<g class="a-swing"><path class="hillc" d="M70 128 L110 128 L104 136 L76 136Z"/><rect class="hillc" x="89" y="100" width="2" height="28"/></g>' +
      '<g class="a-swing" style="animation-delay:-6s"><path class="hillc" d="M170 140 L206 140 L200 147 L176 147Z"/><rect class="hillc" x="187" y="114" width="2" height="26"/></g>' +
      '<g class="a-swing" style="animation-delay:-11s"><path class="hillc" d="M250 124 L280 124 L275 130 L255 130Z"/><rect class="hillc" x="264" y="102" width="2" height="22"/></g>',
    lines: [
      "Somewhere near three the water stops coming in. For a few minutes the harbour holds still, and then every boat on a mooring swings round to face the other way.",
      "The line of weed on the harbour wall is where the sea got to. Nobody marks it. It will be somewhere else tomorrow."
    ]
  },
  4: {
    title: "The boats go out",
    scene: '<defs><linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky)"/><stop offset=".75" style="stop-color:var(--sky2)"/><stop offset="1" style="stop-color:var(--dawn)"/></linearGradient></defs>' +
      '<rect x="0" y="0" width="320" height="110" fill="url(#g4)"/>' + stars(10, 53, 40) +
      '<rect class="seac" x="0" y="108" width="320" height="72"/>' +
      '<path class="hillc" d="M0 70 C30 66 60 80 84 100 L96 110 L0 110Z"/>' +
      '<rect class="wallc" x="22" y="58" width="12" height="10"/><circle class="glow" cx="28" cy="61" r="9"/><rect class="warm a-flick" x="26" y="60" width="4" height="4"/>' +
      '<g class="a-out"><g class="a-bob"><path class="hillc" d="M300 132 L330 132 L325 138 L305 138Z"/><rect class="hillc" x="314" y="114" width="2" height="18"/><circle class="warm" cx="315" cy="113" r="1.6"/></g></g>' +
      '<g class="a-out" style="animation-delay:-9s"><g class="a-bob" style="animation-delay:-2s"><path class="hillc" d="M330 150 L364 150 L358 157 L336 157Z"/><rect class="hillc" x="346" y="128" width="2" height="22"/><circle class="warm" cx="347" cy="127" r="1.6"/></g></g>' +
      '<g class="a-out" style="animation-delay:-20s"><g class="a-bob" style="animation-delay:-4s"><path class="hillc" d="M310 122 L334 122 L330 127 L314 127Z"/><rect class="hillc" x="321" y="108" width="2" height="14"/><circle class="warm" cx="322" cy="107" r="1.4"/></g></g>',
    lines: [
      "The fishing boats leave on the last of the ebb, one after another, each with a single light at the masthead. They pass under the Point close enough to see the watch-house lamp still burning.",
      "Nobody on the boats signals to the hill. That lamp is for one boat only, and everyone knows which one, and nobody says."
    ]
  },
  5: {
    title: "First light on the wall",
    scene: '<defs><linearGradient id="g5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky2)"/><stop offset=".55" style="stop-color:var(--dawn)"/><stop offset="1" style="stop-color:var(--dawn2)"/></linearGradient></defs>' +
      '<rect x="0" y="0" width="320" height="120" fill="url(#g5)"/>' +
      '<rect class="seac" x="0" y="118" width="320" height="62"/>' +
      '<path style="stroke:var(--dawn2);stroke-width:1.5;opacity:.6" d="M120 128 H220 M140 136 H200 M150 146 H190"/>' +
      '<rect class="wallc" x="0" y="96" width="210" height="22"/><rect class="wallc" x="196" y="78" width="14" height="40"/>' +
      '<rect x="0" y="96" width="210" height="2" style="fill:var(--dawn2);opacity:.7"/>' +
      '<g class="a-glide"><path class="a-flap" style="fill:none;stroke:var(--hill);stroke-width:1.6" d="M40 50 q6 -6 12 0 q6 -6 12 0"/></g>' +
      '<g class="a-glide" style="animation-delay:-5s"><path class="a-flap" style="fill:none;stroke:var(--hill);stroke-width:1.4;animation-delay:-.5s" d="M90 34 q5 -5 10 0 q5 -5 10 0"/></g>' +
      '<g class="a-glide" style="animation-delay:-11s"><path class="a-flap" style="fill:none;stroke:var(--hill);stroke-width:1.2;animation-delay:-.9s" d="M20 70 q4 -4 8 0 q4 -4 8 0"/></g>' +
      '<g><path class="hillc" d="M60 92 q0 -5 5 -5 q4 0 5 3 l5 -1 l-4 3 v4 h-11z"/><path class="hillc" d="M130 92 q0 -5 5 -5 q4 0 5 3 l5 -1 l-4 3 v4 h-11z"/></g>',
    lines: [
      "Light comes to the top of the harbour wall before it reaches anything else in the town. For ten minutes the stones along the edge are the colour of a pear.",
      "The gulls are already up. They walk the wall end to end as if they were checking it, and then they leave, all at once, as if it had passed."
    ]
  },
  6: {
    title: "Six bells",
    scene: '<rect x="0" y="0" width="320" height="180" style="fill:var(--dawn)"/>' +
      '<rect x="0" y="120" width="320" height="60" style="fill:var(--dawn2);opacity:.35"/>' +
      '<rect class="wallc" x="0" y="110" width="110" height="70"/><path class="wallc" d="M0 110 L55 86 L110 110Z"/>' +
      '<rect class="wallc" x="220" y="100" width="100" height="80"/><path class="wallc" d="M220 100 L270 80 L320 100Z"/>' +
      '<rect class="hillc" x="138" y="36" width="44" height="144"/><path class="hillc" d="M134 36 L160 10 L186 36Z"/>' +
      '<rect style="fill:var(--dawn)" x="146" y="44" width="28" height="34"/>' +
      '<g class="a-bell"><rect class="hillc" x="159" y="50" width="2" height="6"/><path class="hillc" d="M152 70 q0 -14 8 -14 q8 0 8 14 h2 v2 h-20 v-2z"/></g>' +
      '<rect class="hillc" x="0" y="172" width="320" height="8"/>',
    lines: [
      "The bell on the harbour office is rung by hand at six, which is the only time it is rung at all. The fishermen's wives used to count it. Now it is mostly the gulls who object.",
      "The post van comes down the hill with its lights still on and turns them off halfway, at the same lamp post every day."
    ]
  },
  7: {
    title: "Shutters up",
    scene: '<rect x="0" y="0" width="320" height="180" style="fill:var(--day)"/>' +
      '<rect class="wallc" x="40" y="40" width="240" height="140"/>' +
      '<path class="hillc" d="M30 40 L160 8 L290 40Z"/>' +
      '<rect class="glow" x="70" y="88" width="90" height="62"/><rect class="warm" x="78" y="96" width="74" height="46" opacity=".55"/>' +
      '<g class="hillc"><ellipse cx="94" cy="138" rx="9" ry="4"/><ellipse cx="114" cy="138" rx="9" ry="4"/><ellipse cx="134" cy="138" rx="9" ry="4"/><ellipse cx="104" cy="131" rx="8" ry="3.5"/><ellipse cx="124" cy="131" rx="8" ry="3.5"/></g>' +
      '<defs><clipPath id="c7"><rect x="74" y="92" width="82" height="54"/></clipPath></defs>' +
      '<g clip-path="url(#c7)"><g class="a-shutter"><rect x="74" y="46" width="82" height="46" style="fill:var(--fog)"/><path style="stroke:var(--wall);stroke-width:1;opacity:.6" d="M74 54 h82 M74 62 h82 M74 70 h82 M74 78 h82 M74 86 h82"/></g></g>' +
      '<rect class="hillc" x="70" y="84" width="90" height="10"/>' +
      '<rect class="hillc" x="196" y="104" width="44" height="76"/>' +
      '<rect class="hillc" x="214" y="14" width="12" height="20"/>' +
      '<rect class="hillc" x="0" y="170" width="320" height="10"/>',
    lines: [
      "At seven the baker on Ropewalk Lane rolls the shutter up, and the window that was the only light at one o'clock is now the only thing in the street that smells of anything.",
      "There is a queue of two. There is always a queue of two, though not always the same two. The first loaves of the day go into paper still too hot to hold."
    ]
  },
  8: {
    title: "The sea road",
    scene: '<defs><linearGradient id="g8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--day)"/><stop offset="1" style="stop-color:var(--sun)"/></linearGradient></defs><rect x="0" y="0" width="320" height="110" fill="url(#g8)"/><rect class="seac" x="0" y="96" width="320" height="34" opacity=".85"/><path class="hillc" d="M0 70 C30 66 60 80 84 96 L0 96Z"/><rect class="wallc" x="0" y="130" width="320" height="50"/><path style="stroke:var(--fog);stroke-width:1;opacity:.45" d="M0 137 H320"/><rect class="hillc" x="238" y="92" width="52" height="38"/><path class="hillc" d="M232 92 L264 74 L296 92Z"/><rect class="hillc" x="260" y="62" width="8" height="12"/><path class="hillc" d="M258 62 L264 54 L270 62Z"/><rect style="fill:var(--sun)" x="246" y="102" width="8" height="10"/><rect style="fill:var(--sun)" x="274" y="102" width="8" height="10"/><g class="a-walk"><g class="a-step" style="animation-delay:0.0s"><circle class="hillc" cx="60" cy="127" r="2"/><rect class="hillc" x="58.5" y="129" width="3" height="7" rx="1"/></g><g class="a-step" style="animation-delay:0.15s"><circle class="hillc" cx="70" cy="128" r="2"/><rect class="hillc" x="68.5" y="130" width="3" height="7" rx="1"/></g><g class="a-step" style="animation-delay:0.3s"><circle class="hillc" cx="78" cy="128" r="2"/><rect class="hillc" x="76.5" y="130" width="3" height="7" rx="1"/></g><g class="a-step" style="animation-delay:0.45s"><circle class="hillc" cx="88" cy="127" r="2"/><rect class="hillc" x="86.5" y="129" width="3" height="7" rx="1"/></g><g class="a-step" style="animation-delay:0.6s"><circle class="hillc" cx="96" cy="128" r="2"/><rect class="hillc" x="94.5" y="130" width="3" height="7" rx="1"/></g><g class="a-step" style="animation-delay:0.75s"><circle class="hillc" cx="106" cy="128" r="2"/><rect class="hillc" x="104.5" y="130" width="3" height="7" rx="1"/></g><g class="a-step" style="animation-delay:0.9s"><circle class="hillc" cx="114" cy="127" r="2"/><rect class="hillc" x="112.5" y="129" width="3" height="7" rx="1"/></g><g class="a-step" style="animation-delay:.3s"><circle class="hillc" cx="138" cy="126" r="2.4"/><rect class="hillc" x="136.2" y="128.4" width="3.6" height="8.6" rx="1"/></g></g>',

var dial = document.getElementById("dial"), hour = document.getElementById("hour"), foot = document.getElementById("foot");
var now = new Date().getHours();
var pad = function(h){ return (h < 10 ? "0" : "") + h; };
var written = Object.keys(HOURS).length;
var buttons = [];
for (var h = 0; h < 24; h++){
  var li = document.createElement("li"), b = document.createElement("button");
  b.type = "button"; b.textContent = pad(h); b.dataset.h = h;
  if (HOURS[h]) b.className = "done";
  if (h === now) b.className += " now";
  b.setAttribute("aria-label", pad(h) + ":00" + (HOURS[h] ? "" : ", not written yet") + (h === now ? ", the hour it is now" : ""));
  b.addEventListener("click", function(){ show(+this.dataset.h); });
  li.appendChild(b); dial.appendChild(li); buttons.push(b);
}
function show(h){
  buttons.forEach(function(b, i){ b.setAttribute("aria-pressed", i === h ? "true" : "false"); });
  var d = HOURS[h], label = pad(h) + ":00 – " + pad(h) + ":59";
  var head = '<p class="when"><span>' + label + '</span><span>' + (h === now ? "now, where you are" : "") + '</span></p>';
  if (!d){
    hour.innerHTML = head + '<div class="blank">This hour hasn\'t been written yet.</div>';
    return;
  }
  hour.innerHTML = head +
    '<svg class="scene" viewBox="0 0 320 180" role="img" aria-label="' + d.title + '">' + d.scene + '</svg>' +
    '<h2>' + d.title + '</h2>' + d.lines.map(function(l){ return "<p>" + l + "</p>"; }).join("");
}
foot.textContent = written + " of 24 hours written so far.";
show(now);
})();
